name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "*.md"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  detect-scope:
    name: Detect CI Scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect docs-only changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          is_docs_path() {
            local path="$1"
            [[ "$path" == docs/* ]] || [[ "$path" == *.md ]]
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$PUSH_HEAD_SHA"
          fi

          if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
            docs_only=false
          else
            docs_only=true
            while IFS= read -r -d '' change_status; do
              if ! IFS= read -r -d '' path_before; then
                docs_only=false
                break
              fi

              if ! is_docs_path "$path_before"; then
                docs_only=false
                break
              fi

              if [[ "$change_status" == R* ]] || [[ "$change_status" == C* ]]; then
                if ! IFS= read -r -d '' path_after; then
                  docs_only=false
                  break
                fi

                if ! is_docs_path "$path_after"; then
                  docs_only=false
                  break
                fi
              fi
            done < <(git diff --name-status -z "$base_sha" "$head_sha")
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"

  validate:
    name: Lint, Tests, Build, and Supabase Checks
    needs: detect-scope
    runs-on: ubuntu-latest

    steps:
      - name: Skip heavy validation for docs-only pull requests
        if: needs.detect-scope.outputs.docs_only == 'true'
        run: echo "Docs-only PR detected; heavy validation is intentionally skipped."

      - name: Checkout
        if: needs.detect-scope.outputs.docs_only != 'true'
        uses: actions/checkout@v6

      - name: Setup Node
        if: needs.detect-scope.outputs.docs_only != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Setup Deno
        if: needs.detect-scope.outputs.docs_only != 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Supabase CLI
        if: needs.detect-scope.outputs.docs_only != 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.93.0

      - name: Install dependencies
        if: needs.detect-scope.outputs.docs_only != 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: needs.detect-scope.outputs.docs_only != 'true'
        run: npx playwright install chromium

      - name: Lint
        if: needs.detect-scope.outputs.docs_only != 'true'
        run: npm run lint

      - name: Run unit tests
        if: needs.detect-scope.outputs.docs_only != 'true'
        run: npm test

      - name: Run Edge Function Deno tests
        if: needs.detect-scope.outputs.docs_only != 'true'
        run: npm run test:functions

      - name: Run local Supabase integration and database tests
        if: needs.detect-scope.outputs.docs_only != 'true'
        run: npm run test:supabase

      - name: Run attendee trusted-backend Playwright smoke tests
        if: needs.detect-scope.outputs.docs_only != 'true'
        run: npm run test:e2e:attendee:trusted-backend

      - name: Build web app
        if: needs.detect-scope.outputs.docs_only != 'true'
        run: npm run build:web

      - name: Build site app
        if: needs.detect-scope.outputs.docs_only != 'true'
        run: npm run build:site

      - name: Check issue-session function
        if: needs.detect-scope.outputs.docs_only != 'true'
        run: deno check --no-lock supabase/functions/issue-session/index.ts

      - name: Check complete-game function
        if: needs.detect-scope.outputs.docs_only != 'true'
        run: deno check --no-lock supabase/functions/complete-game/index.ts

      - name: Check save-draft function
        if: needs.detect-scope.outputs.docs_only != 'true'
        run: deno check --no-lock supabase/functions/save-draft/index.ts

      - name: Check generate-event-code function
        if: needs.detect-scope.outputs.docs_only != 'true'
        run: deno check --no-lock supabase/functions/generate-event-code/index.ts

      - name: Check publish-draft function
        if: needs.detect-scope.outputs.docs_only != 'true'
        run: deno check --no-lock supabase/functions/publish-draft/index.ts

      - name: Check unpublish-event function
        if: needs.detect-scope.outputs.docs_only != 'true'
        run: deno check --no-lock supabase/functions/unpublish-event/index.ts

      - name: Upload Playwright artifacts on failure
        if: failure() && needs.detect-scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: tmp/playwright/test-results*

  report-ci-failure:
    name: Report CI Failure To PR
    needs: [detect-scope, validate]
    if: failure() && github.event_name == 'pull_request' && needs.detect-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write
      actions: read
      contents: read

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER_REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      VALIDATE_JOB_NAME: "Lint, Tests, Build, and Supabase Checks"

    steps:
      - name: Verify gh CLI version >= 2.89.0
        run: |
          set -euo pipefail
          version="$(gh --version | awk 'NR==1 {print $3}')"
          required="2.89.0"
          lowest="$(printf '%s\n%s\n' "$required" "$version" | sort -V | head -n1)"
          if [ "$lowest" != "$required" ]; then
            echo "gh CLI is $version; reporter requires >= $required" >&2
            exit 1
          fi
          echo "gh CLI $version satisfies >= $required"

      - name: Identify failing validate job and first failed step
        id: failure
        run: |
          set -euo pipefail
          jobs_json="$(gh api "repos/${OWNER_REPO}/actions/runs/${RUN_ID}/jobs?per_page=100")"

          failed_job="$(printf '%s' "$jobs_json" | jq --arg name "$VALIDATE_JOB_NAME" '
            .jobs
            | map(select(.name == $name and .conclusion == "failure"))
            | .[0] // null
          ')"

          : > "${RUNNER_TEMP}/job_id.txt"
          : > "${RUNNER_TEMP}/job_name.txt"
          : > "${RUNNER_TEMP}/step_name.txt"

          if [ "$failed_job" = "null" ] || [ -z "$failed_job" ]; then
            echo "mode=degraded" >> "$GITHUB_OUTPUT"
            echo "job_url=$RUN_URL" >> "$GITHUB_OUTPUT"
          else
            echo "mode=ok" >> "$GITHUB_OUTPUT"
            job_url="$(printf '%s' "$failed_job" | jq -r '.html_url')"
            echo "job_url=$job_url" >> "$GITHUB_OUTPUT"
            printf '%s' "$failed_job" | jq -r '.id' > "${RUNNER_TEMP}/job_id.txt"
            printf '%s' "$failed_job" | jq -r '.name' > "${RUNNER_TEMP}/job_name.txt"
            printf '%s' "$failed_job" | jq -r '
              [.steps[] | select(.conclusion == "failure")][0].name // ""
            ' > "${RUNNER_TEMP}/step_name.txt"
          fi

      - name: Build comment body
        id: body
        run: |
          set -euo pipefail
          mode="${{ steps.failure.outputs.mode }}"
          job_url="${{ steps.failure.outputs.job_url }}"

          body_file="${RUNNER_TEMP}/comment_body.md"
          : > "$body_file"

          if [ "$mode" = "degraded" ]; then
            printf 'CI failed before validation — [run logs](%s)\n\n' "$job_url" >> "$body_file"
            printf '<details>\n<summary>No failing %s job in this run</summary>\n\n' "$VALIDATE_JOB_NAME" >> "$body_file"
            printf '```\n' >> "$body_file"
            printf 'See the linked run page for the failure detail.\n' >> "$body_file"
            printf '```\n\n</details>\n' >> "$body_file"
          else
            job_id="$(cat "${RUNNER_TEMP}/job_id.txt")"
            job_name="$(cat "${RUNNER_TEMP}/job_name.txt")"
            step_name="$(cat "${RUNNER_TEMP}/step_name.txt")"

            raw_log="${RUNNER_TEMP}/job_failed.log"
            isolated_log="${RUNNER_TEMP}/step_isolated.log"
            tail_log="${RUNNER_TEMP}/log_tail.txt"

            gh run view --repo "$OWNER_REPO" --log-failed --job "$job_id" > "$raw_log" || true

            if [ -n "$step_name" ]; then
              awk -F'\t' -v s="$step_name" '$2 == s' "$raw_log" > "$isolated_log" || true
            else
              : > "$isolated_log"
            fi

            if [ -s "$isolated_log" ]; then
              tail -n 200 "$isolated_log" > "$tail_log"
              summary="Last 200 lines of failed-step output"
            else
              tail -n 200 "$raw_log" > "$tail_log" || true
              if [ -n "$step_name" ]; then
                summary="Last 200 lines from failed steps in \`$job_name\` — first failed step was \`$step_name\` but its output could not be isolated"
              else
                summary="Last 200 lines from failed steps in \`$job_name\`"
              fi
            fi

            if [ -n "$step_name" ]; then
              printf 'CI failed: `%s` in `%s` — [run logs](%s)\n\n' "$step_name" "$job_name" "$job_url" >> "$body_file"
            else
              printf 'CI failed in `%s` — [run logs](%s)\n\n' "$job_name" "$job_url" >> "$body_file"
            fi

            printf '<details>\n<summary>%s</summary>\n\n' "$summary" >> "$body_file"
            printf '```\n' >> "$body_file"
            cat "$tail_log" >> "$body_file"
            printf '\n```\n\n</details>\n' >> "$body_file"
          fi

          echo "body_file=$body_file" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --repo "$OWNER_REPO" --body-file "${{ steps.body.outputs.body_file }}"
